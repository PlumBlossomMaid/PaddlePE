name: CI

on:
  push:
    branches: [master, "release/*"]
  pull_request:
    branches: [master, "release/*"]
    paths:
      - "paddlepe/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.0 pre-commit

      - name: Run ruff check
        run: ruff check paddlepe/ tests/ --fix --exit-non-zero-on-fix

      - name: Run ruff format
        run: ruff format paddlepe/ tests/ --check

  tests-cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PaddlePaddle (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install paddlepaddle==3.3.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          pip install numpy pytest pytest-timeout

      - name: Install paddlePE
        run: |
          pip install -e .
          pip install resampy 2>/dev/null || true

      - name: Run IO tests
        run: |
          python -m pytest tests/test_io.py tests/test_base.py tests/test_postproc.py -v --timeout=120

      - name: Import sanity
        run: |
          python -c "from paddlepe import PE; print('Models:', PE.list_models())"
          python -c "import tempfile, numpy as np; from paddlepe.io import write_f0, read_f0; f = tempfile.NamedTemporaryFile(suffix='.f0', delete=False); write_f0(f.name, np.ones(100, dtype=np.float32)); f0, c, sr, h = read_f0(f.name); print(f'F0 I/O OK: {len(f0)} frames')"
          python -c "from paddlepe.postproc import decode; print('Postproc OK')"
